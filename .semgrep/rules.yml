rules:
  # Fallback rules only (used when Semgrep Registry packs do not cover
  # a category). Messages are intentionally short and technical..

  - id: hardcoded-secrets
    message: Hardcoded secret detected.
    severity: ERROR
    languages:
      - python
    metadata:
      vulnerability_class:
        - Hardcoded secrets
    patterns:
      - pattern-either:
          - pattern: API_KEY = $VALUE
          - pattern: PASSWORD = $VALUE
          - pattern: SECRET_TOKEN = $VALUE
          - pattern: CREDENTIAL = $VALUE

  - id: path-traversal
    message: File operation with user-controlled path detected.
    severity: ERROR
    languages:
      - python
    metadata:
      vulnerability_class:
        - Path traversal
    pattern: open($PATH, ...)
    where:
      - metavariable-regex:
          metavariable: $PATH
          regex: '(\+|f"|f''|%|format\(|input\(|sys\.argv)'

  - id: insecure-deserialization
    message: pickle.loads() call detected.
    severity: ERROR
    languages:
      - python
    metadata:
      vulnerability_class:
        - Insecure deserialization
    pattern: pickle.loads($DATA)

  - id: insecure-ssl-verification
    message: requests.get(..., verify=False) detected.
    severity: ERROR
    languages:
      - python
    metadata:
      vulnerability_class:
        - Insecure SSL verification
    pattern: requests.get($URL, verify=False)
