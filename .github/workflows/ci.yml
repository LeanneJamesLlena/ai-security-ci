name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install google-genai
          sudo apt-get update
          sudo apt-get install -y jq
          # Semgrep (via opentelemetry) requires `pkg_resources`, which is provided by older setuptools.
          # Newer setuptools versions removed/changed `pkg_resources` and break semgrep startup.
          python -m pip install "setuptools==65.5.0"
          python -m pip install "semgrep==1.95.0"
          python -m pip install --force-reinstall "setuptools==65.5.0"
      
      - name: Run Semgrep scan
        run: |
          echo "Running Semgrep scan on src/vulnerable_tasks/"
          ls -la src/vulnerable_tasks/ || echo "Directory listing failed"
          # Use Semgrep Registry rules so findings use Semgrep-authored, technical messages
          # (baseline for actionability/comprehensibility research).
          semgrep scan \
            --config p/python \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config r/python.lang.security.audit \
            --config .semgrep/rules.yml \
            --json --output semgrep-results-raw.json \
            src/vulnerable_tasks/
        continue-on-error: true
      
      - name: Check scan output
        if: always()
        run: |
          if [ -f semgrep-results-raw.json ]; then
            echo "✓ semgrep-results-raw.json exists"
            echo "File size: $(wc -c < semgrep-results-raw.json) bytes"
            echo "First 500 chars of results:"
            head -c 500 semgrep-results-raw.json || cat semgrep-results-raw.json | head -c 500
          else
            echo "✗ semgrep-results-raw.json not found"
          fi

      - name: Select exactly 6 findings (one per category)
        if: always()
        run: |
          set -euo pipefail
          [ -f semgrep-results-raw.json ] || exit 1
          python3 scripts/select_semgrep_findings.py semgrep-results-raw.json semgrep-results.json
          echo "Selected findings written to semgrep-results.json"
          jq '.results | length' semgrep-results.json

      - name: Validate selected scan results
        if: always()
        run: |
          set -euo pipefail
          [ -f semgrep-results.json ] || exit 1
          FINDINGS=$(jq '.results | length' semgrep-results.json)
          if [ "$FINDINGS" -ne 6 ]; then
            echo "✗ Expected exactly 6 findings after selection, got: $FINDINGS"
            exit 1
          fi
          echo "✓ Validation passed: $FINDINGS findings detected."
      
      - name: Display results summary
        if: always()
        run: |
          set -euo pipefail
          [ -f semgrep-results.json ] || exit 0
          
          TOTAL=$(jq '.results | length' semgrep-results.json)
          echo "📊 Semgrep Scan Complete"
          echo "Total findings: $TOTAL"
          echo ""
          echo "Findings by severity:"
          jq -r '.results | group_by(.extra.severity) | .[] | "\(.[0].extra.severity): \(length)"' semgrep-results.json
        
      - name: Generate LLM explanations
        if: always() && hashFiles('semgrep-results.json') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_explanations.py

      
      - name: Generate comment
        if: always() && github.event_name == 'pull_request'
        run: |
          set +e  # Don't exit on error, we want to always generate a comment
          
          if [ ! -f semgrep-results.json ]; then
            {
              echo "## 🔒 Semgrep Security Scan Results"
              echo ""
              echo "**Scan failed or no results file generated.**"
              echo ""
              echo "Please check the workflow logs for details."
              echo ""
              echo "<!-- AI-SECURITY-FINDINGS -->"
            } > comment.md
            exit 0
          fi
          
          TOTAL=$(jq -r '.results | length // 0' semgrep-results.json 2>/dev/null || echo "0")
          
          if [ -z "$TOTAL" ] || [ "$TOTAL" = "null" ] || [ "$TOTAL" -eq 0 ]; then
            {
              echo "## 🔒 Semgrep Security Scan Results"
              echo ""
              echo "**Total findings**: 0"
              echo ""
              echo "No security issues found."
              echo ""
              echo "📦 Full results available as workflow artifacts: \`semgrep-results.json\`, \`llm-explanations.json\`"
              echo ""
              echo "<!-- AI-SECURITY-FINDINGS -->"
            } > comment.md
          else
            ERROR_COUNT=$(jq -r '[.results[] | select(.extra.severity == "ERROR")] | length // 0' semgrep-results.json 2>/dev/null || echo "0")
            WARNING_COUNT=$(jq -r '[.results[] | select(.extra.severity == "WARNING")] | length // 0' semgrep-results.json 2>/dev/null || echo "0")
            INFO_COUNT=$(jq -r '[.results[] | select(.extra.severity == "INFO")] | length // 0' semgrep-results.json 2>/dev/null || echo "0")
            
            SEVERITY_BREAKDOWN=""
            [ "$ERROR_COUNT" -gt 0 ] && SEVERITY_BREAKDOWN="${SEVERITY_BREAKDOWN}- **ERROR**: $ERROR_COUNT"$'\n'
            [ "$WARNING_COUNT" -gt 0 ] && SEVERITY_BREAKDOWN="${SEVERITY_BREAKDOWN}- **WARNING**: $WARNING_COUNT"$'\n'
            [ "$INFO_COUNT" -gt 0 ] && SEVERITY_BREAKDOWN="${SEVERITY_BREAKDOWN}- **INFO**: $INFO_COUNT"$'\n'
            [ -z "$SEVERITY_BREAKDOWN" ] && SEVERITY_BREAKDOWN="- No severity data available"$'\n'
            
            jq -r '.results | 
              map(. + {severity_order: (if .extra.severity == "ERROR" then 0 elif .extra.severity == "WARNING" then 1 elif .extra.severity == "INFO" then 2 else 3 end)}) | 
              sort_by(.severity_order, .path, .start.line) | 
              .[0:10] | 
              .[] | 
              "**\(.check_id)** — `\(.path):\(.start.line)` — \(.extra.message) _(Severity: \(.extra.severity // "unknown"))_"' \
              semgrep-results.json > findings_list.txt 2>/dev/null || echo "Error generating findings list" > findings_list.txt
            
            {
              echo "## 🔒 Semgrep Security Scan Results"
              echo ""
              echo "**Total findings**: $TOTAL"
              echo ""
              echo "### Breakdown by Severity"
              echo -n "$SEVERITY_BREAKDOWN"
              echo "### Findings"
              cat findings_list.txt
              echo ""
              echo "📦 Full results available as workflow artifact: \`semgrep-results.json\`"
              echo ""
              echo "<!-- AI-SECURITY-FINDINGS -->"
            } > comment.md
          fi
      
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Check if comment.md exists
            if (!fs.existsSync('comment.md')) {
              console.log('comment.md not found, skipping comment posting');
              return;
            }
            
            const commentBody = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- AI-SECURITY-FINDINGS -->';
            
            // Find existing comments with the marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.body.includes(marker) && 
              comment.user.type === 'Bot'
            );
            
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              console.log('Updated existing PR comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
              console.log('Created new PR comment');
            }
      
      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep-results.json
            llm-explanations.json
          retention-days: 30